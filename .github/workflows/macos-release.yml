name: macOS Release

# governed-release-contract: theyos-safe-external-write-v1
# governed-release-required-build: scripts/ci/check-governed-macos-release.py

on:
  push:
    tags:
      - "mac-v*"
  workflow_dispatch:
    inputs:
      expected_ref:
        description: "Complete annotated tag ref, for example refs/tags/mac-v1.0.1"
        required: true
        type: string
      expected_oid:
        description: "Full 40-hex commit OID peeled from the annotated tag"
        required: true
        type: string

permissions:
  contents: read

env:
  APPCAST_URL: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
  DERIVED_DATA_PATH: .build/xcode-derived-release
  SOYEHT_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SOYEHT_SPARKLE_PUBLIC_ED_KEY }}

jobs:
  release:
    name: Build signed macOS DMG
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_oid || github.ref }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3.0"

      - name: Verify build environment
        shell: bash
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            expected_ref="${{ inputs.expected_ref }}"
            expected_oid="${{ inputs.expected_oid }}"
          else
            expected_ref="${GITHUB_REF}"
            expected_oid=""
          fi

          if [[ ! "$expected_ref" =~ ^refs/tags/mac-v[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z]+)?$ ]]; then
            echo "Expected ref must be a complete macOS annotated tag ref." >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "$expected_ref"; then
            echo "Expected tag ref does not exist in the checkout." >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "$expected_ref")" != "tag" ]]; then
            echo "Expected tag ref is not an annotated tag object." >&2
            exit 1
          fi
          if [[ -z "$expected_oid" ]]; then
            expected_oid="$(git rev-parse "${expected_ref}^{commit}")"
          fi
          if [[ ! "$expected_oid" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected OID must be a full lowercase 40-hex commit OID." >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${expected_ref}^{commit}")" != "$expected_oid" ]]; then
            echo "Expected tag does not peel to the expected commit OID." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$expected_oid" ]]; then
            echo "Checked-out commit does not match the expected commit OID." >&2
            exit 1
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$expected_oid" refs/remotes/origin/main; then
            echo "Expected OID is not already merged into origin/main." >&2
            exit 1
          fi

          tag="${expected_ref#refs/tags/}"
          version="${tag#mac-v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z]+)?$ ]]; then
            echo "Invalid version '$version'. Use a tag like mac-v1.0.1." >&2
            exit 1
          fi
          declared_versions="$(
            sed -n 's/.*MARKETING_VERSION = \([^;]*\);.*/\1/p' \
              TerminalApp/Soyeht.xcodeproj/project.pbxproj | sort -u
          )"
          if [[ "$declared_versions" != "$version" ]]; then
            echo "Tag version does not equal every declared MARKETING_VERSION." >&2
            exit 1
          fi

          echo "expected_ref=$expected_ref" >> "$GITHUB_OUTPUT"
          echo "expected_oid=$expected_oid" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check release secrets
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          SOYEHT_APNS_P8_BASE64: ${{ secrets.SOYEHT_APNS_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            SPARKLE_PRIVATE_KEY \
            SOYEHT_SPARKLE_PUBLIC_ED_KEY \
            APPLE_DEVELOPER_ID_P12_BASE64 \
            APPLE_DEVELOPER_ID_P12_PASSWORD \
            APPLE_NOTARY_KEY_P8_BASE64 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID \
            APPLE_TEAM_ID \
            APPLE_CODESIGN_IDENTITY \
            SOYEHT_APNS_P8_BASE64
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub secret ${name}." >&2
              missing=1
            fi
          done
          exit "${missing}"

      - name: Import Developer ID certificate
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/soyeht-signing.keychain-db"
          keychain_password="$(uuidgen)"

          decode_base64() {
            local value="$1"
            local output="$2"
            if ! printf '%s' "${value}" | base64 --decode > "${output}" 2>/dev/null; then
              printf '%s' "${value}" | base64 -D > "${output}"
            fi
          }

          decode_base64 "${APPLE_DEVELOPER_ID_P12_BASE64}" "${certificate_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${APPLE_DEVELOPER_ID_P12_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -s "${keychain_path}"
          security find-identity -v -p codesigning "${keychain_path}"

          rm -f "${certificate_path}"
          echo "APPLE_SIGNING_KEYCHAIN=${keychain_path}" >> "${GITHUB_ENV}"

      - name: Prepare APNs key
        env:
          SOYEHT_APNS_P8_BASE64: ${{ secrets.SOYEHT_APNS_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SOYEHT_APNS_P8_BASE64:-}" ]]; then
            echo "Missing GitHub secret SOYEHT_APNS_P8_BASE64." >&2
            exit 1
          fi

          apns_path="${RUNNER_TEMP}/apns.p8"
          if ! printf '%s' "${SOYEHT_APNS_P8_BASE64}" | base64 --decode > "${apns_path}" 2>/dev/null; then
            printf '%s' "${SOYEHT_APNS_P8_BASE64}" | base64 -D > "${apns_path}"
          fi
          chmod 600 "${apns_path}"
          echo "APNS_KEY_PATH=${apns_path}" >> "${GITHUB_ENV}"

      - name: Prepare notary API key
        env:
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail

          decode_base64() {
            local value="$1"
            local output="$2"
            if ! printf '%s' "${value}" | base64 --decode > "${output}" 2>/dev/null; then
              printf '%s' "${value}" | base64 -D > "${output}"
            fi
          }

          notary_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          decode_base64 "${APPLE_NOTARY_KEY_P8_BASE64}" "${notary_key_path}"
          chmod 600 "${notary_key_path}"
          echo "APPLE_NOTARY_KEY_PATH=${notary_key_path}" >> "${GITHUB_ENV}"

      - name: Fetch theyos engine
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/fetch-engine.sh

      - name: Archive Soyeht for macOS
        id: archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          archive_path="${RUNNER_TEMP}/Soyeht.xcarchive"
          rm -rf "${archive_path}"
          xcodebuild \
            -project TerminalApp/SoyehtMac.xcodeproj \
            -scheme SoyehtMac \
            -skipPackagePluginValidation \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "${archive_path}" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            SOYEHT_UPDATE_FEED_URL="$APPCAST_URL" \
            SOYEHT_SPARKLE_PUBLIC_ED_KEY="$SOYEHT_SPARKLE_PUBLIC_ED_KEY" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${APPLE_CODESIGN_IDENTITY}" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            SKIP_INSTALL=NO \
            archive
          echo "archive_path=${archive_path}" >> "$GITHUB_OUTPUT"

      - name: Package notarized DMG
        id: package
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="$RUNNER_TEMP/soyeht-release"
          dmg_name="Soyeht.dmg"
          dmg_path="$archive_dir/$dmg_name"
          notes_path="$archive_dir/Soyeht.md"

          rm -rf "$archive_dir"
          mkdir -p "$archive_dir"

          ARCHIVE_PATH="${{ steps.archive.outputs.archive_path }}" \
          DMG_OUTPUT_DIR="$archive_dir" \
          EXPORT_PATH="${RUNNER_TEMP}/soyeht-export" \
          DEVELOPER_ID_APPLICATION="${APPLE_CODESIGN_IDENTITY}" \
          TEAM_ID="${APPLE_TEAM_ID}" \
          APPLE_NOTARY_KEY_PATH="${APPLE_NOTARY_KEY_PATH}" \
          APPLE_NOTARY_KEY_ID="${APPLE_NOTARY_KEY_ID}" \
          APPLE_NOTARY_ISSUER_ID="${APPLE_NOTARY_ISSUER_ID}" \
          APNS_KEY_SOURCE="${APNS_KEY_PATH:-}" \
            scripts/build-dmg.sh

          test -f "$dmg_path"

          tag_body="$(git for-each-ref --format='%(contents)' '${{ steps.version.outputs.expected_ref }}')"
          if [[ -z "$tag_body" ]]; then
            tag_body="Soyeht ${{ steps.version.outputs.version }}"
          fi
          printf '%s\n' "$tag_body" > "$notes_path"

          echo "archive_dir=$archive_dir" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$dmg_name" >> "$GITHUB_OUTPUT"
          echo "notes_path=$notes_path" >> "$GITHUB_OUTPUT"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          sparkle_bin="$DERIVED_DATA_PATH/SourcePackages/artifacts/sparkle/Sparkle/bin"
          sign_update="$sparkle_bin/sign_update"
          if [[ ! -x "$sign_update" ]]; then
            echo "Sparkle sign_update tool not found at $sign_update" >&2
            exit 1
          fi

          release_url="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}"
          appcast_path="${{ steps.package.outputs.archive_dir }}/appcast.xml"
          dmg_path="${{ steps.package.outputs.dmg_path }}"
          notes_path="${{ steps.package.outputs.notes_path }}"

          signature_output="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sign_update" --ed-key-file - "$dmg_path")"
          ed_signature="$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' <<< "$signature_output")"
          length="$(sed -n 's/.*length="\([^"]*\)".*/\1/p' <<< "$signature_output")"
          if [[ -z "$ed_signature" || -z "$length" ]]; then
            echo "Could not parse Sparkle signature metadata:" >&2
            echo "$signature_output" >&2
            exit 1
          fi

          notes="$(sed 's/]]>/]]]]><![CDATA[>/g' "$notes_path")"
          pub_date="$(LC_ALL=C date -Ru)"
          cat > "$appcast_path" <<EOF
          <?xml version="1.0" standalone="yes"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
              <channel>
                  <title>Soyeht</title>
                  <item>
                      <title>${{ steps.version.outputs.version }}</title>
                      <pubDate>${pub_date}</pubDate>
                      <sparkle:version>${{ github.run_number }}</sparkle:version>
                      <sparkle:shortVersionString>${{ steps.version.outputs.version }}</sparkle:shortVersionString>
                      <sparkle:minimumSystemVersion>15.0</sparkle:minimumSystemVersion>
                      <description sparkle:format="markdown"><![CDATA[${notes}
          ]]></description>
                      <enclosure url="${release_url}/${{ steps.package.outputs.dmg_name }}" length="${length}" type="application/octet-stream" sparkle:edSignature="${ed_signature}"/>
                  </item>
              </channel>
          </rss>
          EOF

      - name: Write governed artifact manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest_path="${{ steps.package.outputs.archive_dir }}/release-artifact-manifest.json"
          dmg_path="${{ steps.package.outputs.dmg_path }}"
          appcast_path="${{ steps.package.outputs.archive_dir }}/appcast.xml"
          notes_path="${{ steps.package.outputs.notes_path }}"

          python3 - \
            "$manifest_path" \
            "${{ steps.version.outputs.expected_ref }}" \
            "${{ steps.version.outputs.expected_oid }}" \
            "${{ steps.version.outputs.version }}" \
            "$dmg_path" \
            "$appcast_path" \
            "$notes_path" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          manifest_path, expected_ref, expected_oid, version, *paths = sys.argv[1:]
          asset_paths = paths[:2]
          notes_path = pathlib.Path(paths[2])
          release_assets = []
          for path_text in asset_paths:
              path = pathlib.Path(path_text)
              payload = path.read_bytes()
              release_assets.append(
                  {
                      "name": path.name,
                      "sha256": hashlib.sha256(payload).hexdigest(),
                      "size": len(payload),
                  }
              )
          manifest = {
              "contract": "theyos-safe-external-write-v1",
              "expected_ref": expected_ref,
              "expected_oid": expected_oid,
              "version": version,
              "release_assets": release_assets,
              "release_notes": {
                  "name": notes_path.name,
                  "sha256": hashlib.sha256(notes_path.read_bytes()).hexdigest(),
                  "size": notes_path.stat().st_size,
              },
          }
          pathlib.Path(manifest_path).write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

          test -s "$manifest_path"
          echo "manifest_path=$manifest_path" >> "$GITHUB_OUTPUT"

      - name: Upload governed release inputs
        uses: actions/upload-artifact@v4
        with:
          name: soyeht-macos-${{ steps.version.outputs.version }}-${{ steps.version.outputs.expected_oid }}
          path: |
            ${{ steps.package.outputs.dmg_path }}
            ${{ steps.package.outputs.archive_dir }}/appcast.xml
            ${{ steps.package.outputs.notes_path }}
            ${{ steps.manifest.outputs.manifest_path }}
          if-no-files-found: error
          compression-level: 0

      - name: Clean up signing keychain
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          security delete-keychain "${APPLE_SIGNING_KEYCHAIN:-${RUNNER_TEMP}/soyeht-signing.keychain-db}" || true
