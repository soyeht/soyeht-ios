name: Onboarding Quality Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "TerminalApp/Soyeht/Onboarding/**"
      - "TerminalApp/Soyeht/APNs/**"
      - "TerminalApp/Soyeht/Home/**"
      - "TerminalApp/SoyehtMac/Welcome/**"
      - "TerminalApp/SoyehtMac/Continuity/**"
      - "Packages/SoyehtCore/**"
      - "scripts/fetch-engine.sh"
      - "scripts/theyos-engine.version"
      - "scripts/theyos-engine.sha256"
      - "scripts/ci/lint-ui-resources.py"
      - "scripts/ci/extract-engine-log-safe.py"
      - "scripts/ci/engine-safe-stages.txt"
      - "scripts/ci/test-engine-log-extractor"
      - "scripts/ci/engine-log-diagnostic"
      - "scripts/ci/test-workflow-signal-hardening.py"
      - "scripts/ci/harness-safe-stages.txt"
      - ".github/workflows/onboarding-quality.yml"

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  # ── SoyehtCore package unit tests ────────────────────────────────────────────
  core-tests:
    name: SoyehtCore Unit Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Run SoyehtCore tests
        env:
          SWIFT_TEST_DISABLE_PARALLELIZATION: "1"
        run: swift test --package-path Packages/SoyehtCore -v

  # EngineHarness is a distinct signal: its known failure remains red without
  # obscuring the result of the rest of the SoyehtCore unit-test suite.
  engine-harness:
    name: EngineHarness Tests (isolated CI)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # The pinned engine is arm64 and may advertise Bonjour services. GitHub's
      # fresh macOS runner is the deliberately isolated execution environment;
      # CI=true supplies EngineHarnessTests' second safety interlock.
      - name: Run EngineHarnessTests in isolated CI
        env:
          THEYOS_HARNESS: "1"
          SWIFT_TEST_DISABLE_PARALLELIZATION: "1"
          # The harness archives each engine.log under RUNNER_TEMP itself (it
          # derives the path from RUNNER_TEMP + GITHUB_ACTIONS; no free-form
          # path env), so the diagnostic step below can extract the safe summary.
        run: swift test --package-path Packages/SoyehtCore --filter EngineHarness

      # Privacy-safe diagnostic. Runs even when the harness failed (that is when
      # we most need the cause). The control gate proves the extractor is a
      # sound allowlist (exact-token membership, zero planted values); then the
      # same extractor turns each captured engine.log into an environment-free
      # one-line summary. The RAW engine.log is never uploaded, and neither the
      # file names nor any raw bytes are echoed — only extractor output. Fixed
      # tokens report capture states that could not be safely published or
      # extracted; raw logs and paths are never printed.
      - name: Engine-log privacy-safe diagnostic
        if: always()
        # The whole diagnostic is one shared script that the control gate copies
        # and mutates, so its guarantees (gate-first abort, fixed token on
        # extractor failure) are proven against the REAL artifact, not a duplicate
        # snippet. It runs the gate first under `set -Eeuo pipefail`, then feeds
        # each captured engine.log through the extractor; only extractor output
        # and fixed tokens reach stdout, and the raw log is never uploaded.
        run: bash scripts/ci/engine-log-diagnostic

  # ── UI resource lint: localization + theme-driven colors ───────────────────
  ui-resource-lint:
    name: UI Resource Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Verify localized UI strings and theme colors
        run: python3 scripts/ci/lint-ui-resources.py

      - name: Verify workflow signal contracts
        run: python3 scripts/ci/test-workflow-signal-hardening.py

  # ── iOS onboarding build check ────────────────────────────────────────────────
  ios-build:
    name: iOS Build (onboarding targets)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build RelayStreamGuestFFI XCFramework
        env:
          RELAY_STREAM_GUEST_FFI_PROFILE: release
        run: scripts/bootstrap-relay-stream-guest-ffi.sh

      - name: Build NatProbeFFI XCFramework
        env:
          NAT_PROBE_FFI_PROFILE: release
        run: scripts/bootstrap-nat-probe-ffi.sh

      - name: Build Soyeht iOS
        run: |
          set -o pipefail
          SIM_ARCH="$(uname -m)"
          xcodebuild build \
            -project TerminalApp/Soyeht.xcodeproj \
            -scheme Soyeht \
            -skipPackagePluginValidation \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest,arch=${SIM_ARCH}" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log
          grep -q "BUILD SUCCEEDED" build.log

      - name: Run iOS unit tests
        run: |
          set -o pipefail
          SIM_ARCH="$(uname -m)"
          xcodebuild test \
            -project TerminalApp/Soyeht.xcodeproj \
            -scheme Soyeht \
            -skipPackagePluginValidation \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest,arch=${SIM_ARCH}" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee test.log
          grep -q "TEST SUCCEEDED" test.log
