name: Swift

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  build:

    runs-on: macos-15

    steps:
    - uses: actions/checkout@v5

    # The pipeline body lives in scripts/ci/test-ios (the canonical command,
    # also run by `soyeht check test-ios` and by developers locally). Each
    # canonical phase step below invokes exactly one phase, so the GitHub UI
    # keeps per-step timing and logs; the checkout step and the ls -lR debug
    # step are not phases. `scripts/ci/test-ios --list` prints the phase order.
    - name: Toolchain versions
      run: scripts/ci/test-ios env

    - name: Verify frozen owner-site A2-R1 corpus integrity
      run: scripts/ci/test-ios corpus-integrity

#    - name: Checkout esctest for testing
#      uses: actions/checkout@v5
#      with:
#        repository: migueldeicaza/esctest
#        ref: python3
#        path: esctest

    - name: List all files, because this is driving me insane, this does not repro anywhere but github
      run: ls -lR

    - name: Mobile Claw VPN DEV E2E tooling tests
      run: scripts/ci/test-ios vpn-e2e-tooling

    - name: Install Rust toolchain
      run: scripts/ci/test-ios rust-toolchain

    - name: Build RelayStreamGuestFFI XCFramework
      run: scripts/ci/test-ios ffi-relay-stream

    - name: Build NatProbeFFI XCFramework
      run: scripts/ci/test-ios ffi-nat-probe

    - name: Xcode Mac Build
      run: scripts/ci/test-ios mac-build

    - name: Soyeht iOS Build (build-only, fail-loud)
      run: scripts/ci/test-ios ios-build

    - name: Soyeht iOS Unit Tests
      run: scripts/ci/test-ios ios-tests

    - name: Swift Package Build
      run: scripts/ci/test-ios swift-build

    - name: Run tests
      run: scripts/ci/test-ios swift-test

    - name: Coverage
      run: scripts/ci/test-ios coverage
